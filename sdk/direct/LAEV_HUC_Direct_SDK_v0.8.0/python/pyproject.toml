[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laev-huc-direct"
version = "0.8.0"
description = "LAEV HUC Direct SDK: issue, present and verify credentials without node networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42.0.0",
  "filelock>=3.13.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6"]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
huc-direct = "huc_direct.cli:main"

[tool.setuptools]
packages = ["huc_direct"]
