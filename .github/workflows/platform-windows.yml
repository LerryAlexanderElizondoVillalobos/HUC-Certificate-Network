name: HUC Platform — Windows

on:
  pull_request:
    branches: [main, validation/huc-0.8.0-multiplatform, architecture/modular-platform-monorepo]
    paths: ['platforms/windows/**', '.github/workflows/platform-windows.yml']
  push:
    branches: [main, validation/huc-0.8.0-multiplatform, architecture/modular-platform-monorepo]
    paths: ['platforms/windows/**', '.github/workflows/platform-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: huc-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-core:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Windows implementation and test tools
        run: python -m pip install -e . pytest
      - name: Run portable Windows suite
        run: python -m pytest -q tests --ignore=tests/test_bft_process_cluster.py --junitxml=windows-core.xml
      - name: Repeat BFT TCP recovery regression
        run: python -m pytest -q tests/test_bft_peer.py -k view_change_and_prepared_recovery_over_tcp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huc-windows-py${{ matrix.python-version }}-evidence
          path: windows-core.xml
          if-no-files-found: warn
