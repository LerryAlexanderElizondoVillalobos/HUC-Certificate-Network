name: HUC Direct Android SDK Build

on:
  push:
    branches: [main, integration/huc-0.8.0]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Kotlin library and sample APK compile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Android library and sample
        working-directory: sdk/direct/LAEV_HUC_Direct_SDK_v0.8.0/android
        run: gradle --no-daemon assembleDebug
