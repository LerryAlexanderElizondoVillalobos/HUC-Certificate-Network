name: HUC Platform — macOS

on:
  pull_request:
    branches: [main]
    paths: ['huc*.py', 'tests/**', 'validation/**', 'requirements.txt', 'pyproject.toml', 'platforms/macos/**', '.github/workflows/platform-macos.yml']
  push:
    branches: [main]
    paths: ['huc*.py', 'tests/**', 'validation/**', 'requirements.txt', 'pyproject.toml', 'platforms/macos/**', '.github/workflows/platform-macos.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: huc-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-core:
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install macOS implementation and test tools
        run: python -m pip install -e . pytest
      - name: Run portable macOS suite
        run: python -m pytest -q tests --ignore=tests/test_bft_process_cluster.py --junitxml=macos-core.xml
      - name: Run synthetic funding regression
        run: python -m pytest -q tests/test_funding_sandbox.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huc-macos-py${{ matrix.python-version }}-evidence
          path: macos-core.xml
          if-no-files-found: warn
