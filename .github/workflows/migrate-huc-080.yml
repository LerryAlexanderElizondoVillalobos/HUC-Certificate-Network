name: Integrate HUC 0.8.0 reference implementation

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: huc-080-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/huc-0.8.0
          fetch-depth: 0

      - name: Extract and integrate HUC 0.8.0 source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="docs/LAEV_HUC_v0.8.0_BFT_Consensus.zip"
          test -f "$ARCHIVE"
          mkdir -p "$RUNNER_TEMP/huc080"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/huc080"
          SRC="$RUNNER_TEMP/huc080/LAEV_HUC_v0.8.0"
          test -f "$SRC/huc.py"
          test -f "$SRC/huc_bft.py"
          test -d "$SRC/tests"

          cp "$SRC"/huc*.py .
          cp "$SRC/requirements.txt" requirements.txt
          cp "$SRC/VERSION" VERSION
          cp "$SRC/run_tests.sh" run_tests.sh
          chmod +x run_tests.sh

          rm -rf tests demo
          cp -a "$SRC/tests" tests
          cp -a "$SRC/demo" demo

          mkdir -p docs
          for file in ARCHITECTURE.md PROTOCOL.md SECURITY.md PHYSICAL_DEVICE_TEST.md FEDERATED_AUTHORITIES.md CHANGELOG.md RELEASE_NOTES_0.5.0.md RELEASE_NOTES_0.6.0.md RELEASE_NOTES_0.7.0.md RELEASE_NOTES_0.8.0.md TEST_RESULTS_0.6.0.txt TEST_RESULTS_0.7.0.txt TEST_RESULTS_0.8.0.txt PUBLIC_DEMO_README.md; do
            if [ -f "$SRC/$file" ]; then cp "$SRC/$file" "docs/$file"; fi
          done

          rm -rf src/huc
          rmdir src 2>/dev/null || true

          cat > pyproject.toml <<'PYPROJECT'
          [build-system]
          requires = ["setuptools>=69", "wheel"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "laev-huc"
          version = "0.8.0"
          description = "Hybrid UTXO Certificate infrastructure with X.509, HUC-CC and BFT-inspired replicated state"
          readme = "README.md"
          requires-python = ">=3.10"
          dependencies = [
            "cryptography>=42.0.0",
            "filelock>=3.13.0"
          ]

          [tool.setuptools]
          py-modules = [
            "huc", "huc_bft", "huc_bft_peer", "huc_federation",
            "huc_membership", "huc_peer", "huc_replicated", "huc_view"
          ]
          PYPROJECT

          cat > README.md <<'README'
          # LAEV HUC Certificate Network 0.8.0

          **HUC — Hybrid UTXO Certificate** is an experimental certificate infrastructure combining X.509 credentials, signed HUC-CC authorization evidence, a logical UTXO lifecycle and an optional replicated BFT-inspired state network.

          > Status: experimental laboratory implementation. Not a blockchain, cryptocurrency, formally verified BFT protocol, production-certified PKI or independent security-audited system.

          ## Core capabilities

          - X.509 certificate issuance, renewal and revocation.
          - HUC-CC signed authorization and certificate binding.
          - Logical UTXO state with sequence and hash-chain continuity.
          - Independent authority approvals and membership management.
          - Replicated state across independent validators.
          - PRE-PREPARE, PREPARE, prepared-lock acknowledgements and COMMIT.
          - Signed view change, prepared-operation recovery and state synchronization.
          - TCP peer transport, TLS transport security and Ed25519 application signatures.
          - Public verification bundles that do not contain issuer or validator private keys.

          ## Architecture profiles

          **Standalone / HUC Direct:** a verifier can validate a signed credential package offline using a separately distributed trust anchor and state attestation. It does not require validators or a network connection for basic package verification.

          **Replicated / HUC BFT:** institutions operate independent validators to agree on shared certificate state. This is an optional deployment profile for shared state, not a prerequisite for local credential verification. The HUC 0.8 BFT implementation is PBFT-inspired and adds a HUC-specific prepared-lock acknowledgement stage; it is not claimed to be formally equivalent to PBFT.

          ## Requirements

          - Python 3.10+
          - `cryptography>=42.0.0`
          - `filelock>=3.13.0`

          ## Install and test

          ```bash
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          ```

          The four-process TLS cluster test can be run independently:

          ```bash
          python -m unittest tests.test_bft_process_cluster -v
          ```

          ## Repository map

          - `huc.py`: X.509, HUC-CC, logical UTXO and certificate lifecycle.
          - `huc_bft.py`: BFT-inspired state machine, quorum certificates and recovery.
          - `huc_bft_peer.py`: BFT phase orchestration over peer transport.
          - `huc_peer.py`: authenticated TCP/TLS peer transport.
          - `huc_replicated.py`: replicated state and synchronization.
          - `huc_federation.py`: independent authority approval workflow.
          - `huc_membership.py`: validator membership transitions.
          - `huc_view.py`: view-change and recovery data structures.
          - `tests/`: automated unit, adversarial, network and cluster tests.
          - `demo/`: public demonstration fixtures and verification scripts.
          - `docs/`: protocol, architecture, security and physical-device procedures.
          - `.github/workflows/`: CI, security and integration automation.

          ## Security boundaries

          The repository includes experimental security controls, but no independent cryptographic audit, formal verification, production hardening or physical multi-institution deployment certification has been completed. The TLS cluster test runs four processes on one host using loopback; it is not evidence of WAN, NAT or four-device interoperability. See [Security](docs/SECURITY.md) and [Physical device test](docs/PHYSICAL_DEVICE_TEST.md).

          Never commit private keys, live credentials, production certificates or real personal data. Public demo fixtures are not production trust anchors.

          ## Version reference

          The original HUC 0.8.0 source and public test packages remain preserved in `docs/` as versioned reference archives. See [Release notes](docs/RELEASE_NOTES_0.8.0.md), [Architecture](docs/ARCHITECTURE.md) and [Protocol](docs/PROTOCOL.md).

          ## Commercial rights

          No open-source license is granted by this repository unless a LICENSE file explicitly states otherwise. All rights are reserved by the copyright holder. Commercial use, redistribution and derivative distribution require written permission or a separate license.
          README

          cat > docs/DEPLOYMENT-PROFILES.md <<'PROFILES'
          # HUC Deployment Profiles

          HUC supports two complementary deployment profiles. They must not be conflated.

          ## Standalone credential verification

          A relying application receives a public credential package containing X.509, HUC-CC and the applicable signed state evidence. It verifies the package locally against a trust anchor obtained independently. Basic verification can be offline. The issuer remains responsible for publishing current state/revocation evidence.

          ## Replicated institutional state

          Independent validators maintain a common replicated UTXO state. HUC BFT coordinates ISSUE, RENEW and REVOKE transitions with quorum certificates, prepared locks, view change and verified synchronization. This profile requires network connectivity between validators.

          ## HUC Direct SDK

          HUC Direct SDK is an application integration layer, not a replacement for the BFT protocol. It can support local issuance/presentation/verification workflows and optionally consult an issuer or replicated-state service for fresh status. Android Keystore protects holder private keys from export.

          ## Trust boundaries

          - X.509 proves a certificate chain under a configured CA.
          - HUC-CC binds authorization policy and certificate evidence.
          - UTXO state represents lifecycle transitions.
          - BFT validators agree on shared state under the documented fault assumptions.
          - A standalone verifier trusts the trust anchor and signed state evidence it receives.

          Offline verification cannot independently know about a revocation that has not been delivered to it. A BFT quorum does not make an issuer's claims factually true or legally authorized.
          PROFILES

          cat > docs/CERTIFICATE-SPECIFICATION.md <<'CERT'
          # HUC Certificate and Evidence Specification — 0.8.0

          ## Certificate layer: X.509

          HUC uses X.509 for subject identity, public key, issuer, validity interval and CA signature. The holder's private key is generated and retained by the holder; the issuer receives a CSR, not the holder's private key.

          ## Authorization layer: HUC-CC

          HUC-CC is a signed protocol attestation that binds certificate evidence, issuer policy and the relevant logical UTXO outpoint/state. It is not a blockchain block and is not itself a BFT vote. Validators independently validate X.509 and HUC-CC before accepting an applicable state transition.

          ## State layer: logical UTXO

          ISSUE creates an active output. RENEW consumes/supersedes the previous active output and creates a successor output. REVOKE consumes the active output and records a revoked state. Sequence and head hashes bind the append-only state history.

          ## Replicated-state evidence

          CommitCertificates, prepared evidence and view-change certificates prove that a state transition passed the configured validator quorum. They are separate from the X.509 CA signature and HUC-CC issuer signature.

          ## Verification requirements

          A verifier must validate the X.509 chain and validity, certificate DER hash, HUC-CC canonical hash/signatures/binding, trust anchor, UTXO state evidence and freshness policy. For BFT-backed state, it must also validate commit and view history against the pinned network manifest.

          ## Interoperability status

          HUC 0.8.0 is an experimental implementation-specific format. Canonical JSON conventions, schema evolution, claim vocabularies, portable status proofs and cross-language test vectors require further standardization.
          CERT

          cat > docs/UTXO-MODEL.md <<'UTXO'
          # HUC Logical UTXO Model — 0.8.0

          HUC uses a logical unspent-output state model for certificate lifecycle. It does not transfer currency and is not a blockchain.

          ## Lifecycle

          - **ISSUE:** creates the first active certificate output.
          - **RENEW:** consumes/supersedes the prior active output and creates a successor output linked to the prior outpoint.
          - **REVOKE:** consumes the active output and records the revoked terminal state.

          ## State integrity

          Each accepted transition is bound to a sequence and parent/head hash. In replicated mode, a transition is applied only after a valid CommitCertificate and local revalidation. State export/sync reconstructs and verifies committed history and rejects rollback or forks.

          ## Double-consumption and equivocation

          The state machine rejects attempts to consume an already spent output. BFT validators persist votes and prepared locks to prevent conflicting signatures for the same consensus slot. Durable production storage must protect these records against rollback.

          ## Important distinction

          A local standalone ledger and a replicated BFT ledger have different trust and freshness properties. Offline verification can only evaluate the signed state evidence available to it; it cannot discover a later revocation without updated evidence.
          UTXO

          cat > docs/ROADMAP.md <<'ROADMAP'
          # HUC Roadmap

          ## Current baseline — 0.8.0 experimental reference
          - [x] X.509 credential lifecycle: issue, renew and revoke
          - [x] HUC-CC signed authorization evidence
          - [x] Logical UTXO state and hash-linked history
          - [x] Independent authority approval and membership workflow
          - [x] BFT-inspired prepare, prepared locks, commit and quorum certificates
          - [x] View change, prepared recovery and state synchronization
          - [x] TCP/TLS peer transport and automated tests
          - [x] Public test fixtures and offline verification examples

          ## Next — CI and protocol hardening
          - [ ] Run full test suite on supported Python versions in GitHub Actions
          - [ ] Add coverage reporting and minimum coverage policy
          - [ ] Add fuzz/property-based tests for parsers and signed messages
          - [ ] Publish deterministic cross-language test vectors
          - [ ] Review TLS/mTLS deployment profile and key rotation
          - [ ] Independent protocol and cryptographic audit

          ## Production-readiness research
          - [ ] Transactional durable storage and anti-rollback protections
          - [ ] Formal safety/liveness analysis under explicit network assumptions
          - [ ] Four-device and multi-institution WAN test
          - [ ] Backup, recovery, monitoring and incident-response procedures
          - [ ] Stable HUC Direct SDK API and Android integration tests
          - [ ] Versioned interoperability specification
          ROADMAP

          cat > .github/workflows/ci.yml <<'CI'
          name: HUC 0.8.0 CI

          on:
            push:
              branches: [main, integration/huc-0.8.0]
            pull_request:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: huc-ci-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            unit-and-integration:
              name: Python ${{ matrix.python-version }} test suite
              runs-on: ubuntu-latest
              timeout-minutes: 15
              strategy:
                fail-fast: false
                matrix:
                  python-version: ["3.10", "3.11", "3.12", "3.13"]
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: ${{ matrix.python-version }}
                    cache: pip
                    cache-dependency-path: requirements.txt
                - name: Install dependencies
                  run: |
                    python -m pip install --upgrade pip
                    python -m pip install -r requirements.txt
                - name: Compile source
                  run: python -m compileall -q huc.py huc_bft.py huc_bft_peer.py huc_federation.py huc_membership.py huc_peer.py huc_replicated.py huc_view.py
                - name: Run complete test suite
                  run: python -m unittest discover -s tests -v

            tls-four-process-cluster:
              name: Four-process TLS cluster
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.13"
                - run: python -m pip install -r requirements.txt
                - run: python -m unittest tests.test_bft_process_cluster -v
          CI

          cat > .github/workflows/security.yml <<'SECURITY'
          name: HUC Security Checks

          on:
            push:
              branches: [main, integration/huc-0.8.0]
            pull_request:
              branches: [main]
            schedule:
              - cron: "17 5 * * 1"
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            dependency-audit:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.13"
                - run: python -m pip install --upgrade pip pip-audit
                - run: pip-audit -r requirements.txt

            secret-pattern-check:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Check tracked files for private key PEM blocks
                  shell: bash
                  run: |
                    if git grep -n -I -E '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- . ':!docs/*.zip'; then
                      echo "Private key material detected in tracked text files."
                      exit 1
                    fi
          SECURITY

          cat > .github/workflows/release.yml <<'RELEASE'
          name: HUC Release Validation

          on:
            push:
              tags: ["v*"]
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.13"
                - run: python -m pip install -r requirements.txt
                - run: python -m unittest discover -s tests -v
                - name: Verify version tag
                  if: startsWith(github.ref, 'refs/tags/')
                  run: test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"
          RELEASE

          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Integrate HUC 0.8.0 BFT certificate implementation"
            git push origin HEAD:integration/huc-0.8.0
          fi
