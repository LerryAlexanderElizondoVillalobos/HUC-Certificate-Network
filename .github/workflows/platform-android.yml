name: HUC Platform — Android

on:
  pull_request:
    branches: [main]
    paths: ['sdk/direct/**/android/**', 'platforms/android/**', '.github/workflows/platform-android.yml']
  push:
    branches: [main]
    paths: ['sdk/direct/**/android/**', 'platforms/android/**', '.github/workflows/platform-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: huc-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android library and sample
        working-directory: sdk/direct/LAEV_HUC_Direct_SDK_v0.8.0/android
        run: gradle --no-daemon :huc-direct:assembleDebug :sample:assembleDebug
      - name: Run Keystore instrumentation on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: '-no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect'
          script: |
            cd sdk/direct/LAEV_HUC_Direct_SDK_v0.8.0/android
            gradle --no-daemon :huc-direct:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huc-android-test-reports
          path: sdk/direct/LAEV_HUC_Direct_SDK_v0.8.0/android/huc-direct/build/reports/androidTests/
          if-no-files-found: warn
