name: Extract HUC Direct SDK source

on:
  push:
    branches: [integration/huc-0.8.0]

permissions:
  contents: write

jobs:
  extract:
    if: github.ref == 'refs/heads/integration/huc-0.8.0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/huc-0.8.0
          fetch-depth: 0
      - name: Extract SDK archives and inspect contents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/huc-direct" "$RUNNER_TEMP/huc-direct-demo"
          unzip -q docs/LAEV_HUC_Direct_SDK_v0.8.0.zip -d "$RUNNER_TEMP/huc-direct"
          unzip -q docs/LAEV_HUC_Direct_SDK_Demo_v0.8.0.zip -d "$RUNNER_TEMP/huc-direct-demo"
          if grep -R -I -n -E -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' "$RUNNER_TEMP/huc-direct" "$RUNNER_TEMP/huc-direct-demo"; then
            echo "Private key material found in SDK archives; refusing to publish extracted SDK."
            exit 1
          fi
          mkdir -p sdk/direct sdk/demo
          rsync -a --exclude='__pycache__' --exclude='.venv' --exclude='.git' "$RUNNER_TEMP/huc-direct/" sdk/direct/
          rsync -a --exclude='__pycache__' --exclude='.venv' --exclude='.git' "$RUNNER_TEMP/huc-direct-demo/" sdk/demo/
          find sdk -type f | sort
      - name: Commit extracted SDK source
        shell: bash
        run: |
          set -euo pipefail
          git add sdk/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add HUC Direct SDK 0.8.0 source and demo"
            git push origin HEAD:integration/huc-0.8.0
          fi
