[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huc-certificate-network"
version = "0.1.0"
description = "Experimental UTXO-inspired cryptographic certificate reference implementation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["cryptography>=44,<47"]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1", "pip-audit>=2.7,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
