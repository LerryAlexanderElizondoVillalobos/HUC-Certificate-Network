[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laev-huc"
version = "0.8.0"
description = "Hybrid UTXO Certificate infrastructure with X.509, HUC-CC and BFT-inspired replicated state"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42.0.0",
  "filelock>=3.13.0"
]

[tool.setuptools]
py-modules = [
  "huc", "huc_bft", "huc_bft_peer", "huc_federation",
  "huc_membership", "huc_peer", "huc_replicated", "huc_view", "huc_x509_external", "huc_institutional_authority"
]

[project.scripts]
huc-institutional-authority = "huc_institutional_authority:main"
